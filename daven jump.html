<style>

         pointer-events: none;
         background:
           repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0) 4px),

          transition: transform 0.15s; }

  #rstLabel { left: 840px; }

let actx = null, master = null, noiseBuf = null;


function initAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.6), actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (!actx) return;
  if (actx.state === "suspended") actx.resume();
  applyVolume();
}

function beep(f0, f1, dur, type, vol) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(master);
  o.start(t);
  o.stop(t + dur + 0.05);
}

function playStatic() {
  if (!actx) return;
  const s = actx.createBufferSource();
  const g = actx.createGain();
  s.buffer = noiseBuf;
  g.gain.value = 0.25;
  s.connect(g);
  g.connect(master);
  s.start();
}

const SFX = {
  boing: () => beep(240, 820, 0.22, "square", 0.15),
  coin:  () => beep(880, 1320, 0.10, "square", 0.12),
  hurt:  () => beep(420, 70, 0.45, "square", 0.18),
  win:   () => beep(523, 1046, 0.7, "triangle", 0.22),
  tick:  () => beep(1000, 1000, 0.04, "sine", 0.12),
  hop:   () => beep(500, 700, 0.05, "sine", 0.08),
  squish: () => beep(300, 120, 0.2, "square", 0.15)
};


let volume = 6, muted = false, resets = 0;
let wallet = 0;                      
let levelIdx = 0, state = "title", token = 0;
let L = null;                        
let player = null;
let camX = 0, camY = 0, staticAmt = 0, clockT = 0;
let keys = { left: false, right: false };
let jumpQueued = false;
let osdText = "", osdLeft = 0;
let jokeText = "", jokeLeft = 0;
let cardLines = null, cardLeft = 0;
let popups = [], bits = [], decor = [];
let walletPulse = 0, windDir = 1;

const screen = document.getElementById("screen");
const ctx = screen.getContext("2d");
ctx.imageSmoothingEnabled = false;
const noiseCanvas = document.createElement("canvas");
noiseCanvas.width = 320;
noiseCanvas.height = 180;
const nctx = noiseCanvas.getContext("2d");


function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function approach(v, target, step) {
  if (v < target) return Math.min(v + step, target);
  return Math.max(v - step, target);
}
function overlap(p, cx, cy, rx, ry) {
  return Math.abs(p.x - cx) < rx + p.w / 2 && Math.abs(p.y - cy) < ry + p.h / 2;
}
function bar() {
  let s = "";
  for (let i = 0; i < 10; i++) s += i < volume ? "#" : "-";
  return s;
}
function showOSD(text, secs = 1.6) { osdText = text; osdLeft = secs; }
function showJoke(text, secs = 3) { jokeText = text; jokeLeft = secs; }
function showCard(lines, secs = 2.4) { cardLines = lines; cardLeft = secs; }
function popup(text, x, y) { popups.push({ text, x, y, t: 0 }); }

function applyVolume() {
  if (master) master.gain.value = muted ? 0 : volume / 10;
}

function refreshTV() {
  document.getElementById("volKnob").style.transform = `rotate(${-135 + 27 * volume}deg)`;
  document.getElementById("rstKnob").style.transform = `rotate(${-135 + 270 * ((resets % 8) / 8)}deg)`;
  document.getElementById("led").className = muted ? "off" : "";
}


function ruinsTile(g, col, row, dx, dy) {

  g.drawImage(IMG.ruins, col * 16, row * 16, 16, 16, dx, dy, TILE, TILE);
}

function kenneyTile(g, idx, dx, dy, size) {
  g.drawImage(IMG.tiles, (idx % 20) * 18, Math.floor(idx / 20) * 18, 18, 18, dx, dy, size, size);
}

function drawLeafPad(g, dx, dy, x) {
  
  g.save();
  g.translate(dx + TILE / 2, dy + 10);
  g.rotate((x % 2 ? -1 : 1) * 0.08);
  g.fillStyle = x % 2 ? "#d9671f" : "#e89a2e";
  g.beginPath();
  g.ellipse(0, 0, TILE * 0.62, 10, 0, 0, TAU);
  g.fill();
  g.strokeStyle = "#7a3414";
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(-TILE * 0.6, 0);
  g.lineTo(TILE * 0.6, 0);
  g.stroke();
  g.restore();
}


function walker(kind, x, y, w, h, hp, speed, chase) {
  return { kind, x, y, ox: x, oy: y, w, h, hp, maxHp: hp, speed, chase, span: 150,
           dir: Math.random() < 0.5 ? -1 : 1, face: 1, dead: false, dying: 0, hurtT: 0 };
}

function chestnut(x, y) {
  return { kind: "chestnut", x, y, ox: x, oy: y, w: 40, h: 40, hp: 1, maxHp: 1,
           dead: false, dying: 0, hurtT: 0, rot: 0, t: Math.random() * 6, face: 1 };
}

function buildLevel(i) {
  const d = LEVELS[i];
  const W = Math.max(...d.map.map(r => r.length));
  const rows = d.map.map(r => r.padEnd(W, "."));
  const H = rows.length;
  const cellAt = (x, y) => (y < 0 || y >= H || x < 0 || x >= W) ? "." : rows[y][x];

  const layer = document.createElement("canvas");
  layer.width = W * TILE;
  layer.height = H * TILE;
  const g = layer.getContext("2d");
  g.imageSmoothingEnabled = false;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const c = rows[y][x], dx = x * TILE, dy = y * TILE;
      if (c === "#") {
        const above = cellAt(x, y - 1);
        const col = 8 + (x % 6);
        if (y === H - 1) ruinsTile(g, col, 3, dx, dy);                             
        else if (above === "#" || above === "=") ruinsTile(g, col, 2, dx, dy);     
        else { ruinsTile(g, col, 2, dx, dy); ruinsTile(g, col, 1, dx, dy - 6); }  
      } else if (c === "=") {
        if (d.leaves) {
          drawLeafPad(g, dx, dy, x);
        } else {
          const above = cellAt(x, y - 1);
          ruinsTile(g, 5 + (x % 6), (above === "=" || above === "#") ? 16 : 15, dx, dy);  
        }
      } else if (c === "M") {
        kenneyTile(g, 128, dx + (TILE - 54) / 2, dy + TILE - 54, 54);              
      }
    }
  }
  if (d.tint) {
    g.globalCompositeOperation = "source-atop";
    g.globalAlpha = 0.45;
    g.fillStyle = d.tint;
    g.fillRect(0, 0, layer.width, layer.height);
    g.globalAlpha = 1;
    g.globalCompositeOperation = "source-over";
  }

  const acorns = [], goals = [], enemies = [], mounds = [];
  let start = { x: TILE * 2, y: TILE * 7 };
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const c = rows[y][x];
      const cx = x * TILE + TILE / 2, cy = y * TILE + TILE / 2, floorY = (y + 1) * TILE;
      if (c === "S") start = { x: cx, y: cy };
      else if (c === "*") acorns.push({ x: cx, y: cy, got: false, ph: Math.random() * 6, key: i + ":" + x + "," + y });
      else if (c === "G") goals.push({ x: cx, y: cy, bottom: floorY });
      else if (c === "U") mounds.push({ x: cx, bottom: floorY });
      else if (c === "V") enemies.push(walker("moss", cx, floorY - 30, 90, 60, 2, 70, 115));
      else if (c === "X") enemies.push(walker("boss", cx, floorY - 55, 170, 110, 4, 55, 95));
      else if (c === "H") enemies.push(chestnut(cx, cy));
    }
  }

  return {
    i, name: d.name, joke: d.joke, W, H, rows, layer,
    sky: d.sky, mid: d.mid, front: d.front, decor: d.decor,
    gravity: d.gravity, mud: d.mud, invert: d.invert, leaves: d.leaves, boss: d.boss,
    start, acorns, goals, enemies, mounds
  };
}


function cell(tx, ty) {
  if (tx < 0 || tx >= L.W) return "#";  
  if (ty < 0 || ty >= L.H) return ".";  
  return L.rows[ty][tx];
}
function blocks(c) { return c === "#" || c === "=" || c === "M" || c === "U"; }


function groundAt(p) {
  const ty = Math.floor((p.y + p.h / 2 + 2) / TILE);
  const tx0 = Math.floor((p.x - p.w / 2 + 3) / TILE);
  const tx1 = Math.floor((p.x + p.w / 2 - 3) / TILE);
  for (let tx = tx0; tx <= tx1; tx++) {
    const c = cell(tx, ty);
    if (blocks(c)) return { ch: c, ty };
  }
  return null;
}

function collideX(p) {
  const l = p.x - p.w / 2, r = p.x + p.w / 2;
  const t = p.y - p.h / 2, b = p.y + p.h / 2;
  const tx0 = Math.floor(l / TILE), tx1 = Math.floor((r - 0.01) / TILE);
  const ty0 = Math.floor((t + 1) / TILE), ty1 = Math.floor((b - 1) / TILE);
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      if (blocks(cell(tx, ty))) {
        if (p.vx > 0) p.x = tx * TILE - p.w / 2;
        else if (p.vx < 0) p.x = (tx + 1) * TILE + p.w / 2;
        p.vx = 0;
        return;
      }
    }
  }
}

function collideY(p) {
  const l = p.x - p.w / 2 + 1, r = p.x + p.w / 2 - 1;
  const t = p.y - p.h / 2, b = p.y + p.h / 2;
  const tx0 = Math.floor(l / TILE), tx1 = Math.floor(r / TILE);
  if (p.vy > 0) {
    const ty = Math.floor((b - 0.01) / TILE);
    for (let tx = tx0; tx <= tx1; tx++) {
      const c = cell(tx, ty);
      if (blocks(c)) {
        p.y = ty * TILE - p.h / 2;
        p.vy = 0;
        return { landed: true, ch: c };
      }
    }
  } else if (p.vy < 0) {
    const ty = Math.floor((t + 0.01) / TILE);
    for (let tx = tx0; tx <= tx1; tx++) {
      if (blocks(cell(tx, ty))) {
        p.y = (ty + 1) * TILE + p.h / 2;
        p.vy = 0;
        return { landed: false, ch: null };
      }
    }
  }
  return { landed: false, ch: null };
}

function updatePlayer(dt) {
  const p = player;
  const wasAir = !p.onFloor;
  let dir = 0;

  if (p.active) {
    dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (L.invert) dir = -dir;
    if (jumpQueued && p.onFloor) {
      p.vy = -640 * (L.gravity < 1 ? 1.12 : 1);
      SFX.hop();
    }
  }
  jumpQueued = false;

  const accel = L.mud ? 360 : 2400;   
  p.vx = approach(p.vx, dir * 260, accel * dt);
  if (!p.onFloor) p.vy += 1800 * L.gravity * dt;

  p.x += p.vx * dt;
  collideX(p);
  p.y += p.vy * dt;


  let landCh = null;
  const hit = collideY(p);
  if (hit.landed) {
    landCh = hit.ch;
  } else if (p.vy >= 0) {
    const g = groundAt(p);
    if (g) {
      p.y = g.ty * TILE - p.h / 2;  
      p.vy = 0;
      landCh = g.ch;
    }
  }

  if (landCh !== null) {
    p.onFloor = true;
    if (wasAir && p.active && landCh === "M") {
      p.vy = -980;                  
      p.onFloor = false;
      popup("BOING", p.x, p.y - 30);
      SFX.boing();
    } else if (wasAir && p.active && landCh === "U") {
      p.vy = -1100;                  
      p.onFloor = false;
      popup("SUPER!", p.x, p.y - 30);
      SFX.boing();
    }
  } else {
    p.onFloor = false;
  }

  if (p.vx > 15) p.face = 1;
  else if (p.vx < -15) p.face = -1;
}


function updateWalker(e, dt) {
  const near = player.active && Math.abs(player.x - e.x) < 320 && Math.abs(player.y - e.y) < 150;
  let speed = near ? e.chase : e.speed;
  let dir = near ? (player.x >= e.x ? 1 : -1) : e.dir;
  const footRow = Math.floor((e.y + e.h / 2 + 4) / TILE);
  const aheadX = Math.floor((e.x + dir * (e.w / 2 + 6)) / TILE);
  const groundAhead = blocks(cell(aheadX, footRow));
  const wallAhead = blocks(cell(aheadX, Math.floor(e.y / TILE)));
  if (!near) {
    if (!groundAhead || wallAhead) e.dir = -e.dir;
    if (e.x - e.ox > e.span) e.dir = -1;
    if (e.ox - e.x > e.span) e.dir = 1;
    dir = e.dir;
  } else if (!groundAhead || wallAhead) {
    speed = 0;                        
  }
  e.x += dir * speed * dt;
  e.face = dir;
}

function updateEnemies(dt) {
  for (const e of L.enemies) {
    e.hurtT = Math.max(0, e.hurtT - dt);
    if (e.dead) { e.dying += dt; continue; }
    if (e.kind === "chestnut") {
      e.t += dt;
      e.y = e.oy + Math.sin(e.t * 2) * 50;
      e.rot += dt * 2;
    } else {
      updateWalker(e, dt);
    }
  }
  L.enemies = L.enemies.filter(e => !(e.dead && e.dying > 0.4));
}

function isLocked() {
  return L.boss && L.enemies.some(e => e.kind === "boss" && !e.dead);
}


function staticBurst() {
  staticAmt = 0.9;
  playStatic();
}

function loadLevel(i) {
  token++;
  const my = token;
  levelIdx = i;
  state = "card";
  L = buildLevel(i);
  windDir = L.invert ? -1 : 1;
  decor = makeDecor(L);
  player = { x: L.start.x, y: L.start.y, w: 36, h: 34, vx: 0, vy: 0,
             onFloor: false, active: false, face: 1 };
  popups = []; bits = [];
  camX = clamp(player.x - SW / 2, 0, Math.max(0, L.W * TILE - SW));
  camY = clamp(player.y - SH / 2, 0, Math.max(0, L.H * TILE - SH));
  showCard(["CHANNEL " + (i + 1), L.name], 2.3);
  showJoke(L.joke, 4);
  staticBurst();
  setTimeout(() => {
    if (my === token) {
      state = "play";
      player.active = true;
    }
  }, 2300);
}

function stomp(e) {
  e.hp--;
  player.vy = -620;
  player.onFloor = false;
  e.hurtT = 0.3;
  if (e.hp <= 0) {
    e.dead = true;
    e.dying = 0;
    popup("SQUISH!", e.x, e.y - e.h / 2);
    SFX.squish();
  } else {
    popup("STOMP!", e.x, e.y - e.h / 2);
    SFX.boing();
    if (Math.random() < 0.5) showJoke(pick(MOSS_JOKES), 2);
  }
}

function hurt() {
  if (!player.active) return;
  player.active = false;
  player.vy = -420;
  player.vx = 0;
  player.onFloor = false;
  SFX.hurt();
  showJoke(pick(DEATH_JOKES), 2.2);
  const my = token;
  setTimeout(() => {
    if (my === token && state === "play") respawn();
  }, 1000);
}

function respawn() {
  player.x = L.start.x;
  player.y = L.start.y;
  player.vx = 0;
  player.vy = 0;
  player.active = true;
}

function collectAcorn(a) {
  a.got = true;
  if (!counted.has(a.key)) {
    counted.add(a.key);
    wallet++;
    walletPulse = 0.35;
  }
  popup("+1", a.x, a.y - 30);
  for (let k = 0; k < 8; k++) {
    const ang = (k / 8) * TAU;
    bits.push({ x: a.x, y: a.y, vx: Math.cos(ang) * 140, vy: Math.sin(ang) * 140 - 40, t: 0 });
  }
  SFX.coin();
}

function onGoal() {
  if (state !== "play") return;
  if (isLocked()) {
    showJoke(LOCKED_JOKE, 2.5);
    return;
  }
  state = "win";
  player.active = false;
  SFX.win();
  staticBurst();
  const my = token;
  setTimeout(() => {
    if (my !== token) return;
    if (levelIdx + 1 < LEVELS.length) loadLevel(levelIdx + 1);
    else showEnding();
  }, 1200);
}

function showEnding() {
  token++;
  state = "credits";
  if (player) player.active = false;
  SFX.win();
  staticBurst();
  showCard(["THE END", "You surfed every channel.", "Press R to watch again."], Infinity);
  showJoke("Collected " + wallet + " acorns. Credits: hedgehog by DustDFG (CC-BY-SA 4.0). " +
           "Tiles by Kenney (CC0). Ruins and moss art, night sky by Anokolisa (free).", Infinity);
}

function changeVolume(step) {
  volume = clamp(volume + step, 0, 10);
  muted = false;
  applyVolume();
  showOSD("VOLUME  [" + bar() + "]  " + volume);
  SFX.tick();
  refreshTV();
}

function toggleMute() {
  muted = !muted;
  applyVolume();
  showOSD(muted ? "MUTED" : "SOUND ON", 1.4);
  refreshTV();
}

function resetLevel() {
  resets++;
  refreshTV();
  showOSD("RESET #" + resets, 1.4);
  staticBurst();
  if (state === "credits") {
    loadLevel(0);
    return;
  }
  showJoke(pick(RESET_JOKES), 2.6);
  loadLevel(levelIdx);
}


function makeDecor(lev) {
  const list = [];
  const kind = lev.decor === "fireflies" ? "firefly" : "leaf";
  const n = kind === "firefly" ? 16 : 22;
  for (let k = 0; k < n; k++) list.push(spawnDecor(kind, true));
  if (kind === "leaf") for (let k = 0; k < 8; k++) list.push(spawnDecor("seed", true));
  return list;
}

function spawnDecor(kind, anywhere) {
  return {
    kind,
    x: Math.random() * SW,
    y: anywhere ? Math.random() * SH : -20,
    vx: kind === "leaf" ? 25 + Math.random() * 30 : 6,
    vy: kind === "firefly" ? 0 : (kind === "seed" ? 10 + Math.random() * 12 : 40 + Math.random() * 40),
    rot: Math.random() * 6,
    spin: (Math.random() - 0.5) * 3,
    ph: Math.random() * 6,
    wob: 1 + Math.random(),
    color: pick(LEAF_COLORS),
    size: 5 + Math.random() * 4
  };
}

function updateDecor(dt) {
  for (const d of decor) {
    d.ph += dt;
    if (d.kind === "firefly") {
      d.x += Math.sin(d.ph * 0.9) * 14 * dt;
      d.y += Math.cos(d.ph * 0.7) * 14 * dt;
    } else {
      d.x += (d.vx * windDir + Math.sin(d.ph * d.wob) * 15) * dt;
      d.y += d.vy * dt;
      d.rot += d.spin * dt;
      if (d.y > SH + 20) Object.assign(d, spawnDecor(d.kind, false));
    }
    if (d.x < -30) d.x = SW + 30;
    if (d.x > SW + 30) d.x = -30;
  }
}

function drawDecor() {
  for (const d of decor) {
    if (d.kind === "leaf") {
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      ctx.fillStyle = d.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, d.size * 1.4, d.size, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = "rgba(60, 25, 10, 0.6)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-d.size * 1.2, 0);
      ctx.lineTo(d.size * 1.2, 0);
      ctx.stroke();
      ctx.restore();
    } else if (d.kind === "seed") {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 6, d.y - 10);
      ctx.stroke();
      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      ctx.beginPath();
      ctx.arc(d.x, d.y, 2, 0, TAU);
      ctx.fill();
    } else {
      const a = 0.45 + 0.55 * Math.sin(d.ph * 3);
      const grd = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, 10);
      grd.addColorStop(0, "rgba(255, 246, 170, " + a + ")");
      grd.addColorStop(1, "rgba(255, 246, 170, 0)");
      ctx.fillStyle = grd;
      ctx.fillRect(d.x - 10, d.y - 10, 20, 20);
    }
  }
}


function update(dt) {
  clockT += dt;
  if (osdLeft > 0) { osdLeft -= dt; if (osdLeft <= 0) osdText = ""; }
  if (jokeLeft > 0) { jokeLeft -= dt; if (jokeLeft <= 0) jokeText = ""; }
  if (cardLeft > 0) { cardLeft -= dt; if (cardLeft <= 0) cardLines = null; }
  if (staticAmt > 0) staticAmt = Math.max(0, staticAmt - dt * 1.8);
  if (walletPulse > 0) walletPulse = Math.max(0, walletPulse - dt);
  updateDecor(dt);
  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < 0.9);
  for (const b of bits) { b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 300 * dt; }
  bits = bits.filter(b => b.t < 0.45);
  if (!L || !player) return;

  updatePlayer(dt);
  updateEnemies(dt);

  if (state === "play" && player.active) {
    if (player.y > L.H * TILE + 120) {
      hurt();                        
    } else {
      for (const e of L.enemies) {
        if (e.dead || !overlap(player, e.x, e.y, e.w / 2, e.h / 2)) continue;
        const stompable = e.kind !== "chestnut";
        if (stompable && player.vy > 0 && player.y < e.y - e.h * 0.3) {
          stomp(e);
        } else {
          hurt();
          break;
        }
      }
    }
    if (player.active) {
      for (const a of L.acorns) {
        if (!a.got && overlap(player, a.x, a.y, 22, 26)) collectAcorn(a);
      }
      for (const g of L.goals) {
        if (overlap(player, g.x, g.bottom - 18, 22, 18)) { onGoal(); break; }
      }
    }
  }


  const tx = clamp(player.x - SW / 2, 0, Math.max(0, L.W * TILE - SW));
  const ty = clamp(player.y - SH / 2, 0, Math.max(0, L.H * TILE - SH));
  const k = Math.min(1, dt * 7);
  camX += (tx - camX) * k;
  camY += (ty - camY) * k;
}


function drawText(str, x, y, size, color, align) {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(3, size / 5);
  ctx.strokeStyle = "#000";
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function wrapText(text, maxW) {
  ctx.font = `bold 22px ${FONT}`;
  const words = text.split(" ");
  const lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}


function drawLayer(img, parallax) {
  const w = img.width * (SH / img.height);
  const off = ((-camX * parallax) % w + w) % w;
  for (let x = -off; x < SW; x += w) ctx.drawImage(img, Math.round(x), 0, Math.round(w), SH);
}

function drawBackgrounds() {
  const sky = L ? IMG[L.sky] : IMG.night;
  const mid = L ? (L.mid ? IMG[L.mid] : null) : IMG.cemetery;
  const front = L ? (L.front ? IMG[L.front] : null) : IMG.grassA;
  ctx.imageSmoothingEnabled = true;
  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, SW, SH);
  if (sky) drawLayer(sky, 0.04);
  if (mid) drawLayer(mid, 0.18);
  if (front) drawLayer(front, 0.45);
  ctx.imageSmoothingEnabled = false;
}

function drawAcorn(a) {
  const bob = Math.sin(clockT * 3 + a.ph) * 4;
  const sx = 0.25 + 0.75 * Math.abs(Math.cos(clockT * 2.4 + a.ph));   
  const x = Math.round(a.x - camX), y = Math.round(a.y - camY + bob);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sx, 1);
  ctx.drawImage(IMG.acorn, -21, -28, 42, 56);
  ctx.restore();
  const s = Math.max(0, Math.sin(clockT * 5 + a.ph * 2));  // little sparkle
  if (s > 0.3) {
    ctx.fillStyle = "rgba(255, 255, 255, " + s + ")";
    ctx.fillRect(x + 14, y - 22, 4, 4);
    ctx.fillRect(x + 12, y - 24, 8, 8);
  }
}

function drawMound(m) {
 
  ctx.drawImage(IMG.ruins, 13 * 16, 10 * 16, 48, 32,
                Math.round(m.x - camX - 72), Math.round(m.bottom - camY - 96), 144, 96);
}

function drawDen(gl) {
  const locked = isLocked();
  const x = Math.round(gl.x - camX), y = Math.round(gl.bottom - camY);
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = locked ? 0.65 : 1;
  ctx.fillStyle = locked ? "#5b5257" : "#7a4a26";
  ctx.beginPath();
  ctx.arc(0, 0, 30, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = "#1e120a";
  ctx.beginPath();
  ctx.arc(0, 0, 13, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = locked ? "#7b7077" : "#4f8a2a";             
  ctx.beginPath();
  ctx.ellipse(-16, -30, 12, 6, -0.5, 0, TAU);
  ctx.ellipse(12, -32, 12, 6, 0.4, 0, TAU);
  ctx.fill();
  if (locked) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#d9c9a4";
    ctx.fillRect(-7, -56, 14, 12);
    ctx.strokeStyle = "#d9c9a4";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, -56, 6, Math.PI, 0);
    ctx.stroke();
  }
  ctx.restore();
}

function drawWalker(e) {
  const s = e.kind === "boss" ? 4.5 : 3;
  const w = 42 * s, h = 24 * s;
  ctx.save();
  ctx.translate(Math.round(e.x - camX), Math.round(e.y - camY + (e.h / 2 + 2 - h / 2)));
  if (e.face < 0) ctx.scale(-1, 1);
  if (e.dead) {
    ctx.globalAlpha = Math.max(0, 1 - e.dying / 0.4);
    ctx.scale(1.2, 0.3);
  } else if (e.hurtT > 0) {
    ctx.globalAlpha = 0.55;
  }
  ctx.drawImage(IMG.moss, -w / 2, -h / 2, w, h);
  ctx.restore();
  if (!e.dead && e.kind === "boss") {
    const bx = Math.round(e.x - camX - 80), by = Math.round(e.y - camY - h / 2 - 16);
    ctx.fillStyle = "#000";
    ctx.fillRect(bx, by, 160, 10);
    ctx.fillStyle = "#7dff7a";
    ctx.fillRect(bx + 2, by + 2, Math.max(0, (156 * e.hp) / e.maxHp), 6);
  }
}

function drawChestnut(e) {
  ctx.save();
  ctx.translate(Math.round(e.x - camX), Math.round(e.y - camY));
  ctx.rotate(e.rot);
  ctx.strokeStyle = "#3a1e0c";
  ctx.lineWidth = 4;
  for (let k = 0; k < 12; k++) {
    const a = (k / 12) * TAU;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 14, Math.sin(a) * 14);
    ctx.lineTo(Math.cos(a) * 24, Math.sin(a) * 24);
    ctx.stroke();
  }
  ctx.fillStyle = "#8a4b22";
  ctx.beginPath();
  ctx.arc(0, 0, 17, 0, TAU);
  ctx.fill();
  ctx.fillStyle = "#c27a3a";
  ctx.beginPath();
  ctx.ellipse(-5, -6, 5, 3, -0.6, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawShadow(x, y, rx) {
  ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
  ctx.beginPath();
  ctx.ellipse(Math.round(x - camX), Math.round(y - camY), rx, rx * 0.22, 0, 0, TAU);
  ctx.fill();
}

function drawHog() {
  const p = player;
  let img, frames, fps;
  if (!p.active) { img = IMG.sleep; frames = 4; fps = 3; }
  else if (!p.onFloor || Math.abs(p.vx) > 25) { img = IMG.move; frames = 6; fps = 12; }
  else { img = IMG.idle; frames = 2; fps = 2.5; }
  const f = Math.floor(clockT * fps) % frames;
  ctx.save();
  ctx.translate(Math.round(p.x - camX), Math.round(p.y - 17 - camY));
  if (p.face < 0) ctx.scale(-1, 1);
  ctx.drawImage(img, f * 24, 0, 24, 24, -36, -36, 72, 72);
  ctx.restore();
}

function drawBits() {
  ctx.fillStyle = "#ffd166";
  for (const b of bits) {
    ctx.globalAlpha = Math.max(0, 1 - b.t / 0.45);
    ctx.fillRect(Math.round(b.x - camX) - 3, Math.round(b.y - camY) - 3, 6, 6);
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  for (const p of popups) {
    const a = Math.max(0, 1 - p.t / 0.9);
    ctx.globalAlpha = a;
    drawText(p.text, p.x - camX, p.y - camY - p.t * 30, 20, "#ffd166", "center");
  }
  ctx.globalAlpha = 1;
}

function drawHud() {
  drawText(`CH ${levelIdx + 1}   ${L.name.toUpperCase()}`, 20, 30, 22, "#ffd166", "left");
  const pulse = 1 + walletPulse * 1.2;
  const iw = 28 * pulse, ih = 37 * pulse;
  ctx.drawImage(IMG.acorn, SW - 150 - iw / 2 + 14, 12 - (ih - 37) / 2, iw, ih);
  drawText("x " + wallet, SW - 20, 30, 24, "#ffd166", "right");
}

function drawJoke(text) {
  const lines = wrapText(text, 840);
  const lh = 30;
  const h = lines.length * lh + 20;
  const y0 = SH - 30 - h;
  ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
  ctx.fillRect(SW / 2 - 440, y0, 880, h);
  lines.forEach((ln, i) => drawText(ln, SW / 2, y0 + 10 + lh / 2 + i * lh, 22, "#ffffff", "center"));
}

function drawCard(lines) {
  const h = 60 + 40 * lines.length;
  ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
  ctx.fillRect(SW / 2 - 340, 130, 680, h);
  lines.forEach((ln, i) => {
    if (i === 0) drawText(ln, SW / 2, 175, 52, "#ffd166", "center");
    else drawText(ln, SW / 2, 175 + 56 + (i - 1) * 40, 26, "#ffffff", "center");
  });
}

function drawStatic() {
  const img = nctx.createImageData(320, 180);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random() * 255;
    d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
  }
  nctx.putImageData(img, 0, 0);
  ctx.save();
  ctx.globalAlpha = staticAmt;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(noiseCanvas, 0, 0, SW, SH);
  ctx.restore();
}

function draw() {
  ctx.globalAlpha = 1;
  drawBackgrounds();
  if (L) {
    ctx.drawImage(L.layer, -Math.round(camX), -Math.round(camY));
    for (const m of L.mounds) drawMound(m);
    for (const g of L.goals) drawDen(g);
    for (const a of L.acorns) if (!a.got) drawAcorn(a);
    for (const e of L.enemies) if (e.kind !== "chestnut" && !e.dead) drawShadow(e.x, e.y + e.h / 2, e.w * 0.32);
    if (player.onFloor) drawShadow(player.x, player.y + 17, 22);
    for (const e of L.enemies) {
      if (e.kind === "chestnut") drawChestnut(e);
      else drawWalker(e);
    }
    drawHog();
    drawBits();
  }
  drawDecor();
  if (L) {
    drawPopups();
    drawHud();
  }
  if (osdText) drawText(osdText, SW / 2, 76, 30, "#7dff7a", "center");
  if (jokeText) drawJoke(jokeText);
  if (cardLines) drawCard(cardLines);
  if (staticAmt > 0) drawStatic();
}


window.addEventListener("keydown", (e) => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
  initAudio();

  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
  if (!e.repeat && (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW")) jumpQueued = true;
  if (e.repeat) return;

  if (state === "title") { loadLevel(0); return; }

  switch (e.code) {
    case "BracketRight": case "Equal": case "NumpadAdd": changeVolume(1); break;
    case "BracketLeft": case "Minus": case "NumpadSubtract": changeVolume(-1); break;
    case "KeyM": toggleMute(); break;
    case "KeyR": resetLevel(); break;
  }
});

window.addEventListener("keyup", (e) => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});

window.addEventListener("blur", () => { keys.left = false; keys.right = false; });


function fit() {
  const s = Math.min(window.innerWidth / 1120, (window.innerHeight - 30) / 760, 1);
  document.getElementById("tv").style.transform = `scale(${s})`;
}
window.addEventListener("resize", fit);


let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000);
  lastT = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

loadImages().then(() => {
  state = "title";
  decor = makeDecor({ decor: "leaves" });
  showCard(["DAVEN JUMP", "press any key to switch on the TV"], Infinity);
  refreshTV();
  fit();
  requestAnimationFrame(frame);
});
</script>
</body>
